[project]
name = "florin"
version = "0.2.0"
description = "AI-powered financial terminal for market screening, analysis, and trading"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Core
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",

    # Async
    "aiohttp>=3.9",
    "httpx>=0.27",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",

    # Market Data
    "alpaca-py>=0.28",
    "websockets>=12.0",
    "yfinance>=0.2.36",

    # Sentiment
    "praw>=7.7",

    # LLM - Cloud APIs
    "anthropic>=0.30",
    "google-genai>=1.0",
    "openai>=1.0",
    "groq>=0.9",

    # Telegram
    "aiogram>=3.10",

    # Dashboard
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",

    # Statistical modelling
    "copulax>=2.0.0",
    "statsmodels>=0.14",

    # News scraping
    "beautifulsoup4>=4.12",
    "lxml>=4.9",

    # Utilities
    "structlog>=24.1",
    "rich>=13.7",

    # Data parsing (RBNZ OCR Excel files)
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "aioresponses>=0.7",
]

[project.scripts]
florin = "main:cli_entry"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that hit real external APIs (deselect with -m 'not integration')",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.setuptools.packages.find]
include = [
    "config*",
    "core*",
    "data*",
    "scanner*",
    "sentiment*",
    "analysis*",
    "broker*",
    "telegram_bot*",
    "dashboard*",
    "db*",
    "stats*",
    "tests*",
]
exclude = ["dashboard_ui*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
