[project]
name = "florin"
version = "0.2.0"
description = "AI-powered financial terminal for market screening, analysis, and trading"
requires-python = ">=3.13"
license = { text = "MIT" }

dependencies = [
    # Core
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",

    # Async
    "aiohttp>=3.9",
    "httpx>=0.27",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",

    # Market Data
    "alpaca-py>=0.28",
    "websockets>=12.0",
    "yfinance>=0.2.36",

    # Sentiment
    "praw>=7.7",
    "ddgs>=9.11",

    # LLM - Cloud APIs
    "claude-agent-sdk>=0.1",
    "google-genai>=1.0",
    "openai>=1.0",  # Used by OpenRouter analyser
    "groq>=0.9",

    # Telegram
    "aiogram>=3.10",

    # Dashboard
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",

    # Statistical modelling
    "copulax>=2.0.0",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",  # GaussianProcessRegressor for IV-residual GP fit

    # News scraping
    "beautifulsoup4>=4.12",
    "lxml>=4.9",

    # Utilities
    "structlog>=24.1",
    "rich>=13.7",

    # Data parsing (RBNZ OCR Excel files)
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-timeout>=2.3",
    "ruff>=0.3",
    "mypy>=1.8",
    "aioresponses>=0.7",
]

[project.scripts]
florin = "main:cli_entry"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
# UP042: (str, Enum) is intentional in core models/settings — StrEnum changes
# str()/format/serialization behaviour, which we rely on for API and DB output.
ignore = ["UP042"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() are designed to be called in argument defaults;
# B008 is a known false positive for them.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# Test-local mock classes (MockClient, MockDDGS, ...) correctly use PascalCase.
"tests/**" = ["N806", "N803", "N815", "N802"]
# Options / vol-surface modules use canonical finance notation (K=strike,
# F=forward, T=time-to-expiry, D=discount, theta_T=SSVI anchor, …). These
# names match the Hagan 2002 / Gatheral-Jacquier 2014 papers and the unit
# tests; lower-casing them would obscure the math.
"stats/options/**" = ["N806", "N803", "N815", "N802"]
"dashboard/routes/options.py" = ["N806", "N803", "N815", "N802"]
"dashboard/services/option_surface.py" = ["N806", "N803", "N815", "N802"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Hard per-test timeout so a hung test (e.g. an unmocked network call on a
# restricted CI runner) fails fast with a traceback instead of stalling the
# whole job. 120s is well clear of the slowest legitimate test.
timeout = 120
timeout_method = "thread"
markers = [
    "integration: tests that hit real external APIs (deselect with -m 'not integration')",
]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
# Gate on real type errors only: annotation-completeness (disallow_untyped_defs)
# and Any-return warnings are disabled, and missing third-party stubs are
# ignored, to keep mypy actionable against the existing codebase.
disallow_untyped_defs = false
warn_return_any = false
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = [
    "config*",
    "core*",
    "data*",
    "scanner*",
    "sentiment*",
    "analysis*",
    "broker*",
    "telegram_bot*",
    "dashboard*",
    "db*",
    "stats*",
    "news*",
    "tests*",
]
exclude = ["dashboard_ui*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
